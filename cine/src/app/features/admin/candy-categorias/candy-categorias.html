<h1>Categorías del candy</h1>

@if (error()) { <p class="error">{{ error() }}</p> }
@if (mensaje()) { <p class="ok">{{ mensaje() }}</p> }

@if (cargando()) {
<p>Cargando...</p>
} @else {
<div class="tabla">
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Orden</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (c of categorias(); track c.id) {
            <tr>
                <td>{{ c.nombre }}</td>
                <td>{{ c.orden }}</td>
                <td><button type="button" (click)="eliminar(c)">Eliminar</button></td>
            </tr>
            } @empty {
            <tr>
                <td colspan="3">Todavía no hay categorías.</td>
            </tr>
            }
        </tbody>
    </table>
</div>

<form (submit)="agregar($event)">
    <input type="text" [formField]="f.nombre" placeholder="Nombre de la categoría"
        aria-label="Nombre de la categoría" />
    <input type="number" [formField]="f.orden" placeholder="Orden" aria-label="Orden" style="width:5rem" />
    <button type="submit" [disabled]="f().invalid()">Agregar categoría</button>
</form>
}
